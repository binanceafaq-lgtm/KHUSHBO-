name: KHUSHBO Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KHUSHBO APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Java and Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Verify Java and Project Files
        run: |
          java -version
          python --version
          test -f main.py
          test -f buildozer.spec

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel virtualenv
          python -m pip install buildozer==1.5.0 Cython==0.29.34

      - name: Build KHUSHBO APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KHUSHBO-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
          
